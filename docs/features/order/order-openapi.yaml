openapi: 3.0.3
info:
  title: BookBloom Customer Orders API
  version: 0.1.0-proposed
  description: |
    Read-only customer endpoints for Order History and Order Details.
    JSON uses camelCase. All amounts are INR decimal strings. Order confirmation
    and shipment fulfillment are separate states.
servers:
  - url: /api/v1
    description: API base path; configure the host per environment.
tags:
  - name: Orders
    description: The authenticated customer's own order history and details.
security:
  - BearerAuth: []
paths:
  /orders:
    get:
      tags: [Orders]
      operationId: listCustomerOrders
      summary: List the current customer's order history
      description: Returns only the caller's orders, newest first by default.
      parameters:
        - name: page
          in: query
          description: 1-based page number.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Results per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: fulfillmentStatus
          in: query
          description: Filter by shipment status, independently of order status.
          schema:
            $ref: '#/components/schemas/ShipmentStatus'
      responses:
        '200':
          description: Paginated order summaries for the current customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getCustomerOrder
      summary: Get one of the current customer's orders
      description: |
        Returns immutable purchase and delivery snapshots plus safe payment metadata.
        Order status indicates payment/confirmation state; shipment status indicates
        physical fulfillment progress.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Order UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    Money:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      example: '3448.00'
      description: Non-negative amount in INR.
    Currency:
      type: string
      enum: [INR]
    OrderStatus:
      type: string
      enum: [PENDING_PAYMENT, CONFIRMED, CANCELLED]
    ShipmentStatus:
      type: string
      enum: [PENDING, PROCESSING, SHIPPED, DELIVERED, FAILED, CANCELLED]
    PhysicalFormat:
      type: string
      enum: [PAPERBACK, HARDCOVER]
    PaymentMethodType:
      type: string
      enum: [CARD, PAYPAL]
    CardBrand:
      type: string
      enum: [AMEX, VISA, MASTERCARD]
    OrderHistoryPage:
      type: object
      required: [results, pagination]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        pagination:
          $ref: '#/components/schemas/PageInfo'
    PageInfo:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    OrderSummary:
      type: object
      required: [id, orderNumber, status, placedAt, representativeItem, total, currency]
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
          maxLength: 32
        status:
          $ref: '#/components/schemas/OrderStatus'
        placedAt:
          type: string
          format: date-time
        representativeItem:
          $ref: '#/components/schemas/OrderItemSummary'
        total:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'
        shipmentStatus:
          allOf:
            - $ref: '#/components/schemas/ShipmentStatus'
          nullable: true
    OrderItemSummary:
      type: object
      required: [title, format, quantity, unitPrice]
      properties:
        title:
          type: string
        author:
          type: string
        coverImageUrl:
          type: string
          format: uri
          nullable: true
        format:
          $ref: '#/components/schemas/PhysicalFormat'
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
    OrderDetail:
      type: object
      required:
        [id, orderNumber, status, items, currency, subtotal, shippingAmount, taxAmount, discountAmount, total, shipment, paymentAttempts, createdAt]
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
          maxLength: 32
        status:
          $ref: '#/components/schemas/OrderStatus'
        placedAt:
          type: string
          format: date-time
          nullable: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true
          description: Set only after authoritative payment success.
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        currency:
          $ref: '#/components/schemas/Currency'
        subtotal:
          $ref: '#/components/schemas/Money'
        shippingAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Always 0.00 under the current free-shipping policy.
        taxAmount:
          $ref: '#/components/schemas/Money'
        discountAmount:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        shipment:
          $ref: '#/components/schemas/Shipment'
        paymentAttempts:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAttemptSummary'
        createdAt:
          type: string
          format: date-time
    OrderItem:
      type: object
      required: [id, bookId, physicalVariantId, title, format, quantity, unitPrice, lineTotal, currency]
      properties:
        id:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        physicalVariantId:
          type: string
          format: uuid
        title:
          type: string
          description: Immutable purchase-time title snapshot.
        author:
          type: string
        coverImageUrl:
          type: string
          format: uri
          nullable: true
        format:
          $ref: '#/components/schemas/PhysicalFormat'
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
        lineTotal:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'
    Shipment:
      type: object
      required: [id, status, recipientName, addressLine1, city, stateRegion, postalCode, countryCode, phone]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        recipientName:
          type: string
          description: Recipient name captured at checkout.
        company:
          type: string
          nullable: true
        addressLine1:
          type: string
        addressLine2:
          type: string
          nullable: true
        city:
          type: string
        stateRegion:
          type: string
        postalCode:
          type: string
          pattern: '^[1-9][0-9]{5}$'
        countryCode:
          type: string
          enum: [IN]
        phone:
          type: string
        carrier:
          type: string
          nullable: true
        trackingReference:
          type: string
          nullable: true
        shippedAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
    PaymentAttemptSummary:
      type: object
      required: [id, status, amount, currency, methodType, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [INITIATED, REQUIRES_ACTION, AUTHORIZED, CAPTURED, FAILED, CANCELLED, PARTIALLY_REFUNDED, REFUNDED]
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'
        methodType:
          $ref: '#/components/schemas/PaymentMethodType'
        methodBrand:
          allOf:
            - $ref: '#/components/schemas/CardBrand'
          nullable: true
        lastFour:
          type: string
          pattern: '^[0-9]{4}$'
          nullable: true
          description: Safe display metadata only; never PAN or CVV.
        createdAt:
          type: string
          format: date-time
    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
  responses:
    BadRequest:
      description: Invalid query parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Order does not exist or is not owned by the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
